version: "3.8"

services:
  mimic-train:
    build:
      context: ./codigo
      dockerfile: Dockerfile.train
    container_name: mimic_train
    working_dir: /app
    volumes:
      - ./codigo/models:/app/models
      - type: bind
        source: ./Hito 2
        target: /app/Hito 2
    networks:
      - mimic-network

  mimic-api:
    build:
      context: ./codigo
      dockerfile: Dockerfile.api
    container_name: mimic_api
    working_dir: /app/src
    environment:
      - MODEL_PATH=/app/models/best_mortality_model.pkl
    ports:
      - "8000:8000"
    depends_on:
      - mimic-train
    volumes:
      - ./codigo/models:/app/models
    networks:
      - mimic-network

  mimic-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: mimic_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - mimic-api
    networks:
      - mimic-network

  prometheus:
    image: prom/prometheus
    container_name: mimic_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mimic-network

  grafana:
    image: grafana/grafana
    container_name: mimic_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mimic-network

  alertmanager:
    image: prom/alertmanager
    container_name: mimic_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - mimic-network

networks:
  mimic-network:
    driver: bridge
