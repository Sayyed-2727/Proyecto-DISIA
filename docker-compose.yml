version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: mimic_mlflow
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////mlflow/mlflow.db",
        "--default-artifact-root",
        "/mlflow/artifacts",
      ]
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    networks:
      - mimic-network
    restart: unless-stopped

  mimic-train:
    build:
      context: ./codigo
      dockerfile: Dockerfile.train
    container_name: mimic_train
    working_dir: /app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    volumes:
      - ./codigo/models:/app/models
      - ./codigo/data:/app/data
      - type: bind
        source: ./Hito 2
        target: /app/Hito 2
    networks:
      - mimic-network

  mimic-api:
    build:
      context: ./codigo
      dockerfile: Dockerfile.api
    container_name: mimic_api
    working_dir: /app/src
    environment:
      - MODEL_PATH=/app/models/best_mortality_model.pkl
    ports:
      - "8000:8000"
    depends_on:
      - mimic-train
    volumes:
      - ./codigo/models:/app/models
      - ./codigo/data:/app/data
      - type: bind
        source: ./Hito 2
        target: /app/Hito 2
    networks:
      - mimic-network
    restart: unless-stopped

  mimic-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: mimic_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - mimic-api
    networks:
      - mimic-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: mimic_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    networks:
      - mimic-network
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana
    container_name: mimic_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - mimic-network

  alertmanager:
    image: prom/alertmanager
    container_name: mimic_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - mimic-network

networks:
  mimic-network:
    driver: bridge
